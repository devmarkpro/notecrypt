[graph]
all-features = true
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
]

[advisories]
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    # Reviewed transitive dependencies use this OSI-approved permissive license.
    "BSD-2-Clause",
    "MIT",
    # Unicode data tables use this OSI-approved permissive license.
    "Unicode-3.0",
]
confidence-threshold = 0.93
exceptions = [
    # BIP39 and its reviewed encoding dependencies use the public-domain CC0 license.
    { allow = ["CC0-1.0"], crate = "bip39@2.2.2" },
    { allow = ["CC0-1.0"], crate = "bitcoin_hashes@0.14.101" },
    { allow = ["CC0-1.0"], crate = "hex-conservative@0.2.2" },
    # The reviewed canonical CBOR implementation uses this permissive license.
    { allow = ["BlueOak-1.0.0"], crate = "minicbor@0.26.5" },
    # RustCrypto uses subtle for constant-time cryptographic operations.
    { allow = ["BSD-3-Clause"], crate = "subtle@2.6.1" },
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
