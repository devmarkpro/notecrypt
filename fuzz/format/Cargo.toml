[package]
name = "notecrypt-format-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true
cargo-fuzz-version = "=0.13.1"
rust-toolchain = "nightly-2026-08-01"

[dependencies]
libfuzzer-sys = "0.4"
notecrypt-format = { path = "../../crates/notecrypt-format" }

[[bin]]
name = "decode_header"
path = "fuzz_targets/decode_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_object"
path = "fuzz_targets/decode_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_manifest"
path = "fuzz_targets/decode_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_tree"
path = "fuzz_targets/decode_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_snapshot"
path = "fuzz_targets/decode_snapshot.rs"
test = false
doc = false
bench = false
