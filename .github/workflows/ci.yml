name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: rustfmt
      - run: cargo fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - run: cargo test --workspace --all-features --locked

  task12-unit-stress:
    name: Task 12 Unit stress
    if: github.event_name == 'pull_request' && github.head_ref == 'mkaramyar/notecrypt-phase1-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - name: Run editor supervision twenty times with default parallelism
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 20); do
            echo "editor supervision iteration ${iteration}/20"
            cargo test -p notecrypt-e2e --test editor_supervision --all-features --locked
          done
      - name: Run the full Unit command three times
        shell: bash
        run: |
          set -euo pipefail
          for iteration in $(seq 1 3); do
            echo "full Unit iteration ${iteration}/3"
            cargo test --workspace --all-features --locked
          done

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - run: cargo doc --workspace --all-features --no-deps --locked

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - run: cargo test -p notecrypt-e2e workspace_policy --locked

  desktop-builds:
    name: Stable build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      # Absolute performance thresholds require dedicated benchmark workers.
      - run: cargo build --workspace --all-features --locked
      - if: runner.os == 'Windows'
        run: cargo test -p notecrypt-platform-fs --features test-support --locked -- --nocapture --test-threads=1
      - run: cargo test -p notecrypt-platform-fs --locked
      - run: cargo test -p notecrypt-store --all-features --locked
      - if: runner.os == 'Windows'
        run: cargo test -p notecrypt-editor-workspace --features test-support --test editor_profiles --test workspace_boundary --test ownership_locks --locked -- --test-threads=1
      - if: runner.os == 'Windows'
        run: cargo test -p notecrypt-e2e --test editor_supervision_windows --locked -- --test-threads=1
      - if: runner.os == 'Windows'
        run: cargo test -p notecrypt-e2e --test editor_lock_composed --locked -- --test-threads=1
      - run: cargo test -p notecrypt-benches corpus --locked

  privileged-bind-mount-eze:
    name: Privileged bind-mount EZE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.96.1
      - run: sudo --preserve-env=PATH,CARGO_HOME,RUSTUP_HOME env NOTECRYPT_RUN_PRIVILEGED_BIND_MOUNT_EZE=1 cargo test -p notecrypt-editor-workspace --features test-support --test workspace_boundary real_bind_mount_boundary_is_rejected_before_plaintext_file_creation --locked -- --exact --ignored --test-threads=1
