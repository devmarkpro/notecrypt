[workspace]
resolver = "3"
members = [
    "crates/notecrypt-core",
    "crates/notecrypt-format",
    "crates/notecrypt-crypto",
    "crates/notecrypt-platform-fs",
    "crates/notecrypt-store",
    "crates/notecrypt-backend",
    "crates/notecrypt-replication",
    "crates/notecrypt-service",
    "adapters/notecrypt-backend-git",
    "adapters/notecrypt-device-unlock",
    "adapters/notecrypt-editor-workspace",
    "ui/notecrypt-tui",
    "apps/notecrypt-cli",
    "benches",
    "tests/notecrypt-e2e",
    "tests/notecrypt-crypto-format",
]
exclude = ["fuzz/format"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT"
publish = false

[workspace.dependencies]
argon2 = { version = "0.5", features = ["zeroize"] }
bip39 = { version = "2.2", default-features = false, features = ["std", "zeroize"] }
blake3 = { version = "1.8", features = ["zeroize"] }
cap-fs-ext = "4.0.2"
cap-std = "4.0.2"
chacha20poly1305 = "0.10"
clap = "4.5"
criterion = "0.7"
crossbeam-channel = "0.5"
constant_time_eq = "0.4"
crossterm = "0.29"
getrandom = "0.3"
hkdf = "0.12"
keyring = { version = "3.6", default-features = false }
libc = "0.2"
minicbor = { version = "0.26", features = ["alloc"] }
notify = "8.2"
proptest = "1.7"
ratatui = "0.29"
rpassword = "7.4"
rustix = { version = "1.1.4", features = ["fs", "process", "time"] }
secrecy = "0.10"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.21"
thiserror = "2.0"
toml = "1.0"
tracing = "0.1"
trybuild = "1.0"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
uuid = "1.18"
windows-sys = { version = "0.61", default-features = false }
zeroize = "1.8"

notecrypt-backend = { path = "crates/notecrypt-backend", version = "=0.1.0" }
notecrypt-backend-git = { path = "adapters/notecrypt-backend-git", version = "=0.1.0" }
notecrypt-core = { path = "crates/notecrypt-core", version = "=0.1.0" }
notecrypt-crypto = { path = "crates/notecrypt-crypto", version = "=0.1.0" }
notecrypt-device-unlock = { path = "adapters/notecrypt-device-unlock", version = "=0.1.0" }
notecrypt-editor-workspace = { path = "adapters/notecrypt-editor-workspace", version = "=0.1.0" }
notecrypt-format = { path = "crates/notecrypt-format", version = "=0.1.0" }
notecrypt-platform-fs = { path = "crates/notecrypt-platform-fs", version = "=0.1.0" }
notecrypt-replication = { path = "crates/notecrypt-replication", version = "=0.1.0" }
notecrypt-service = { path = "crates/notecrypt-service", version = "=0.1.0" }
notecrypt-store = { path = "crates/notecrypt-store", version = "=0.1.0" }
notecrypt-tui = { path = "ui/notecrypt-tui", version = "=0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
